
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Shadow Kick!</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap');

        body {
            background-color: #411660;
            color: #FFFFFF;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            align-content: flex-start;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            font-family: 'Pixelify Sans', sans-serif;
        }
        h1 {
            font-family: 'Pixelify Sans', sans-serif;
            text-align: center;
            width: 100%;
            flex-basis: 100%;
        }
        h2 {
            font-family: 'Pixelify Sans', sans-serif;
            text-align: center;
        }
        .section-container {
            padding: 20px;
            margin-bottom: 40px;
            width: 28%;
            max-width: 800px;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            position: relative;
            min-height: calc(100vh - 40px);
            
        }

        #section-1{
            background-color: #05555c;
            border: 3px solid aqua;
            border-radius: 10px;
        }

        #section-2{
            background-color: #741818;
            border: 3px solid rgb(255, 0, 0);
            border-radius: 10px;
        }

        #section-3{
            background-color: #877b0d;
            border: 3px solid rgb(234, 226, 0);
            border-radius: 10px;
        }

        .media-display {
            width: 100%;
            max-width: 600px;
            height: auto;
        }

        .button-area {
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .play-btn {
            border: 3px solid aqua;
            cursor: pointer;
            color: rgb(13, 11, 128);
            background-color: #FFFFFF;
            font-size: xx-large;
            border-radius: 3px;
            font-family: 'Courier New', Courier, monospace;
            transition: transform 0.1s ease;
        }
        .play-btn.greyed-out {
            opacity: 0.6;
            cursor: pointer;
        }
        .explosion-gif {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50%;
            height: auto;
            z-index: 10;
            pointer-events: none;
        }
        .character-appear {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .Kickedcharacters {
            width: 100px;
            height: auto;
        }

        @media (max-width: 950px) {
            .section-container {
                width: 45%;
            }
        }
        @media (max-width: 650px) {
            .section-container {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <h1>-----
        Click the buttons below to make Shadow kick !!
    -----</h1>

    <div class="section-container" id="section-1">

        <img id="display-1"
             class="media-display"
             src="Silver-Kicked-PNG.png"
             alt="Silver Kicked">

        <div class="button-area" id="btn-container-1">
            <button class="play-btn" onclick="handleAction(1, 'regular')">Play</button>
            <button class="play-btn" onclick="handleAction(1, 'reverse')">Reverse</button>
            <button class="play-btn" onclick="handleAction(1, 'multi')">Multi</button>
        </div>

        <div id="characterappear-1" class="character-appear" style="display: none;">
            <h2>" Stop Kicking Me! " - </h2>
            <img src="Silver.png" alt="Silver" class="Kickedcharacters">
        </div>

    </div>

    <div class="section-container" id="section-2">


        <img id="display-2"
             class="media-display"
             src="Infinite-Kicked-PNG.png"
             alt="Infinite Kicked">

        <div class="button-area" id="btn-container-2">
            <button class="play-btn" onclick="handleAction(2, 'regular')">Play</button>
            <button class="play-btn" onclick="handleAction(2, 'reverse')">Reverse</button>
            <button class="play-btn" onclick="handleAction(2, 'multi')">Multi</button>
        </div>

        <div id="characterappear-2" class="character-appear" style="display: none;">
            <h2>" Stop Kicking Me! " - </h2>
            <img src="Infinite.png" alt="Infinite" class="Kickedcharacters">
        </div>

    </div>

    <div class="section-container" id="section-3">

        <img id="display-3"
             class="media-display"
             src="Tails-Kicked-PNG.png"
             alt="Tails Kicked">

        <div class="button-area" id="btn-container-3">
            <button class="play-btn" onclick="handleAction(3, 'regular')">Play</button>
            <button class="play-btn" onclick="handleAction(3, 'reverse')">Reverse</button>
            <button class="play-btn" onclick="handleAction(3, 'multi')">Multi</button>
        </div>

        <div id="characterappear-3" class="character-appear" style="display: none;">
            <h2>" Stop Kicking Me! " - </h2>
            <img src="Tails.png" alt="Tails" class="Kickedcharacters">
        </div>

    </div>

    <audio id="audio-explosion" src="Explosion.mp3"></audio>
    <audio id="audio-silver-regular" src="Silver-Kicked-MP3.mp3"></audio>
    <audio id="audio-silver-reverse" src="Silver-Kicked-Reverse-MP3.mp3"></audio>
    <audio id="audio-silver-multi" src="Silver-Kicked-Multiple-MP3.mp3"></audio>
    <audio id="audio-infinite-regular" src="Infinite-Kicked-MP3.mp3"></audio>
    <audio id="audio-infinite-reverse" src="Infinite-Kicked-Reversed-MP3.mp3"></audio>
    <audio id="audio-infinite-multi" src="Infinite-Kicked-Multiple-MP3.mp3"></audio>
    <audio id="audio-tails-regular" src="Tails-Kicked-MP3.mp3"></audio>
    <audio id="audio-tails-reverse" src="Tails-Kicked-Reverse-MP3.mp3"></audio>
    <audio id="audio-tails-multi" src="Tails-Kicked-Multiple-MP3.mp3"></audio>


    <script>

        const sectionsData = {

            1: {
                clickCount: 0,
                playCount: 0,
                isPlaying: false,
                exploded: false,

                staticImg: 'Silver-Kicked-PNG.png',

                videos: {
                    regular: 'Silver-Kicked-MP4.mp4',
                    reverse: 'Silver-Kicked-Reverse-MP4.mp4',
                    multi: 'Silver-Kicked-Multiple-MP4.mp4'
                },

                audios: {
                    regular: 'audio-silver-regular',
                    reverse: 'audio-silver-reverse',
                    multi: 'audio-silver-multi'
                }
            },

            2: {
                clickCount: 0,
                playCount: 0,
                isPlaying: false,
                exploded: false,

                staticImg: 'Infinite-Kicked-PNG.png',

                videos: {
                    regular: 'Infinite-Kicked-MP4.mp4',
                    reverse: 'Infinite-Kicked-Reversed-MP4.mp4',
                    multi: 'Infinite-Kicked-Multiple-MP4.mp4'
                },

                audios: {
                    regular: 'audio-infinite-regular',
                    reverse: 'audio-infinite-reverse',
                    multi: 'audio-infinite-multi'
                }
            },

            3: {
                clickCount: 0,
                playCount: 0,
                isPlaying: false,
                exploded: false,

                staticImg: 'Tails-Kicked-PNG.png',

                videos: {
                    regular: 'Tails-Kicked-MP4.mp4',
                    reverse: 'Tails-Kicked-Reverse-MP4.mp4',
                    multi: 'Tails-Kicked-Multiple-MP4.mp4'
                },

                audios: {
                    regular: 'audio-tails-regular',
                    reverse: 'audio-tails-reverse',
                    multi: 'audio-tails-multi'
                }
            }

        };


        function handleAction(sectionss, type) {

            const data = sectionsData[sectionss];

            const btnContainer =
                document.getElementById(`btn-container-${sectionss}`);

            const displayArea =
                document.getElementById(`display-${sectionss}`);

            const characterSection =
                document.getElementById(`characterappear-${sectionss}`);

            if (data.exploded) return;

            data.clickCount++;


            if (data.clickCount >= 25) {

                triggerSectionExplosion(sectionss);

                return;
            }

            if (data.isPlaying) return;


            data.isPlaying = true;

            const buttons = btnContainer.querySelectorAll('button');

            buttons.forEach(button => {
                button.classList.add('greyed-out');
            });

            playAudio(data.audios[type]);

            const videoElem = document.createElement('video');

            videoElem.src = data.videos[type];
            videoElem.className = 'media-display';
            videoElem.autoplay = true;
            videoElem.muted = true;
            videoElem.playsInline = true;


        
          
            displayArea.parentNode.replaceChild(videoElem, displayArea);

            videoElem.id = `display-${sectionss}`;

            if (type === 'multi') {

                setTimeout(() => {

                    if (!data.exploded) {
                        revertToImage(
                            sectionss,
                            videoElem,
                            data,
                            btnContainer,
                            characterSection
                        );
                    }

                }, 4000);

            } else {

                videoElem.onended = () => {

                    revertToImage(
                        sectionss,
                        videoElem,
                        data,
                        btnContainer,
                        characterSection
                    );

                };

            }

        }

        function revertToImage(
            sectionss,
            videoElem,
            data,
            btnContainer,
            characterSection
        ) {

            if (data.exploded) return;

            const imgElem = document.createElement('img');

            imgElem.src = data.staticImg;
            imgElem.className = 'media-display';
            imgElem.id = `display-${sectionss}`;


            videoElem.parentNode.replaceChild(imgElem, videoElem);

            data.isPlaying = false;

            data.playCount++;


            if (data.playCount >= 3) {

                characterSection.style.display = 'flex';

            }

            const buttons = btnContainer.querySelectorAll('button');

            buttons.forEach(button => {
                button.classList.remove('greyed-out');
            });

        }


        function playAudio(kickedaudio) {

            const audioElem = document.getElementById(kickedaudio);

            if (audioElem) {

                audioElem.currentTime = 0;

                audioElem.play().catch(err =>
                    console.log("Audio play prevented:", err)
                );

            }

        }


        function triggerSectionExplosion(sectionss) {

            const data = sectionsData[sectionss];

            const btnContainer =
                document.getElementById(`btn-container-${sectionss}`);

            const section =
                document.getElementById(`section-${sectionss}`);


            if (data.exploded) return;

            data.exploded = true;


     
            const displayArea =
                document.getElementById(`display-${sectionss}`);

            if (displayArea && displayArea.tagName === 'VIDEO') {

                displayArea.pause();

            }


            playAudio('audio-explosion');


            const oldExplosion = section.querySelector('.explosion-gif');

            if (oldExplosion) {
                oldExplosion.remove();
            }


            const explosionImg = document.createElement('img');

            explosionImg.src = 'Explosion.gif';
            explosionImg.alt = 'Explosion';
            explosionImg.className = 'explosion-gif';

            section.appendChild(explosionImg);


            btnContainer.innerHTML = '';

            setTimeout(() => {

                explosionImg.remove();

                btnContainer.innerHTML = '';

            }, (1000 / 19) * 19);

        }

    </script>

</body>
</html>
